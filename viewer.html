<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>汽车参数报告 - 预览工具</title>
    <link rel="stylesheet" href="viewer.css">
    <!-- 引入 html2canvas 库，请确保文件存在于插件根目录 -->
    <script src="html2canvas.min.js"></script>
</head>
<body>

    <div class="tool-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px dashed #ccc; padding-bottom: 10px;">
            <div id="status-message" style="font-weight:bold; color:#007bff; margin:0;">正在加载数据...</div>
            <div style="display: flex; gap: 10px;">
                <button id="downloadImageButton">📸 下载长图</button>
<button id="copyStaticHtmlButton" style="background-color: #fd7e14;">📋 复制静态表格 (WP版)</button>
                <button id="printButton">🖨️ 打印 / 另存为 PDF</button>
                <button id="openSettingsButton">⚙️ 打开设置</button>
            </div>
        </div>
        
        <div id="price-options" style="display: none;" class="price-options-container">
            <div class="checkbox-options">
                <label><input type="checkbox" id="showMsrp"> 显示厂商指导价</label>
                <label><input type="checkbox" id="showDealerPrice"> 显示经销商报价</label>
                <label><input type="checkbox" id="showFOBPrice"> 显示FOB价格</label>
                <label><input type="checkbox" id="showSeaFreight"> 显示海运费</label>
                <label><input type="checkbox" id="showCIFPrice"> 显示CIF价格</label>
                <label><input type="checkbox" id="showStockColor"> 显示库存颜色</label>
            </div>
            <div class="currency-options">
                <div>
                    <label>
                        <input type="radio" name="currency_toggle" value="usd" data-rate-id="globalRateUSD" checked> USD
                    </label>
                    <input type="number" id="globalRateUSD" value="7.1" step="0.0001" class="currency-rate-input">
                    
                    <label>
                        <input type="radio" name="currency_toggle" value="eur" data-rate-id="globalRateEUR"> EUR
                    </label>
                    <input type="number" id="globalRateEUR" value="8.3" step="0.0001" class="currency-rate-input">
                </div>
                <div>
                    <button id="fetchRatesButton">获取实时汇率</button>
                </div>
                <div id="rate-status" style="width: 100%; text-align: center;"></div>
            </div>
        </div>

        <p style="margin-top: 10px;">图片插入工具（可选，输入网址后回车或点击按钮）：</p>
        <input type="text" id="imageURLInput" placeholder="输入图片网址，例如：http://example.com/a.jpg">
        <button id="addImageButton">插入图片</button>
        <div style="text-align: right; margin-top: 5px; font-size: 11px; color: #ccc;">Developed by lethaldiranMX</div>
    </div>

    <div id="capture-container">
        <div id="image-placeholder" class="image-row-container"></div>
        <div class="main-container" id="content-placeholder"></div>
        <!-- 页脚将通过 JS 插入到这里 -->
    </div>

    <script src="viewer.js"></script>
</body>
</html>
